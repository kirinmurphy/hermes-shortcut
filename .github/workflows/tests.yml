name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Run tests (hermetic — no Hermes install required)
        env:
          # Belt-and-suspenders: point admin-file paths away from any real
          # ecosystem (tests also swap these at module level via fixtures).
          HERMES_ECOSYSTEM_MANIFEST: ${{ github.workspace }}/tests/fixtures/manifest.yaml
          HERMES_PROJECTS_MD: ${{ github.workspace }}/tests/fixtures/PROJECTS.md
        run: python -m unittest discover -s tests -v
